[package]
name = "claude-code-usage-monitor"
version = "1.4.1"
edition = "2021"
license = "MIT"
authors = ["Arron Craig"]
description = "Claude Code & Codex usage monitor — Linux/Waybar port of CodeZeno/Claude-Code-Usage-Monitor"
repository = "https://github.com/ajcraig99/claude-code-usage-monitor-linux"

[dependencies]
ureq = { version = "2", default-features = false, features = ["native-tls", "json", "proxy-from-env"] }
native-tls = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"

[profile.release]
opt-level = "z"
lto = true
strip = true
codegen-units = 1
panic = "abort"
